services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    healthcheck:
      # First start runs `composer install`, so allow plenty of time.
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      - mailpit

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      # Mailpit has no authentication, so it is only reachable from this machine.
      - "127.0.0.1:8025:8025"

volumes:
  backend_vendor:
  frontend_node_modules:
